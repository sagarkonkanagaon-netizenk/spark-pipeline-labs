name: Bug report
description: Something in a lab gives the wrong result or fails
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you got.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Python 3.12, Java 17, pyspark 4.2.0, delta-spark 4.4.1
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: text
