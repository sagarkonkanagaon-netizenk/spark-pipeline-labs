[project]
name = "spark-pipeline-labs"
version = "0.1.0"
description = "Runnable PySpark + Delta Lake labs: streaming dedup, SCD2 MERGE, skew salting, idempotent backfill"
requires-python = ">=3.10"
dependencies = ["pyspark==4.0.1", "delta-spark==4.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["labs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
