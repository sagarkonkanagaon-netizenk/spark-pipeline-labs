[project]
name = "spark-pipeline-labs"
version = "0.1.0"
description = "Runnable PySpark + Delta Lake labs: streaming dedup, SCD2 MERGE, skew salting, idempotent backfill"
requires-python = ">=3.10"
dependencies = ["pyspark==4.2.0", "delta-spark==4.4.1"]

authors = [{ name = "Sagar Konkanagaon", email = "sagarkonkanagaon@gmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["pyspark", "delta-lake", "data-engineering", "scd2", "streaming"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/sagarkonkanagaon-netizenk/spark-pipeline-labs"
Portfolio = "https://data-foundry-sand.vercel.app"

[project.scripts]
spark-labs = "labs.demo:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3"]

[tool.setuptools]
packages = ["labs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=labs --cov-report=term-missing"

[tool.coverage.run]
omit = ["labs/demo.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
